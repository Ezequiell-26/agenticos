[workspace]
resolver = "2"
members = [
  "crates/kernel", "crates/contracts", "crates/runtime", "crates/execution",
  "crates/scheduler", "crates/providers", "crates/router", "crates/tools",
  "crates/sandbox", "crates/context", "crates/memory", "crates/skills",
  "crates/workflows", "crates/agents", "crates/projects", "crates/artifacts",
  "crates/plugins", "crates/gateway", "crates/security", "crates/observability",
  "crates/evaluation", "crates/source-forge", "crates/protocols", "crates/cli",
  "crates/desktop", "crates/api-server", "crates/concurrency-stress", "crates/crypto",
  "crates/math", "crates/time-utils", "crates/http-client", "crates/async-utils",
  "crates/logging", "crates/metrics", "crates/cache", "crates/compression",
  "crates/rate-limiting", "crates/vector-database", "crates/websockets", "crates/file-watcher",
  "crates/task-scheduler"
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["AgentiCOS contributors"]
repository = "https://github.com/Ezequiell-26/agenticos"

[workspace.dependencies]
tokio = { version = "1.0", features = ["sync", "rt"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
dashmap = "6.0"
parking_lot = "0.12"
once_cell = "1.0"
tokio-util = { version = "0.7", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
