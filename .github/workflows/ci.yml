name: AgentiCOS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agenticos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify durable AI continuity
        run: npm run continuity:verify

      - name: Verify project-state consistency
        run: npm run state:verify

      - name: Verify architecture, types and tests
        run: npm run verify

      - name: Validate implementation state manifest
        run: npm run state:verify

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Check dependency tree
        run: npm ls --depth=0

  verify-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile workspace (optimized)
        run: cargo check --workspace --all-targets

      - name: Test workspace (optimized)
        run: cargo test --workspace --all-targets

      - name: Run concurrency stress tests
        run: cargo test -p concurrency-stress -- --nocapture

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify architecture boundaries
        run: npm run architecture:boundaries

      - name: Verify workspace dependency inheritance
        run: npm run workspace:inheritance

      - name: Verify cargo dependency duplicates
        run: npm run cargo:duplicates

      - name: Verify architecture workspace shape
        run: |
          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f protocols/schemas/event-envelope.schema.json
          test -f reference/manifests/implementation-state.json
          test -f reference/manifests/mit-repositories.json
          echo "Rust architecture foundation: PASS"
