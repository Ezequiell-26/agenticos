[package]
name = "agenticos-api-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = { workspace = true }
actix-web = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
agenticos-a2a = { path = "../../infrastructure/a2a" }
agenticos-artifacts = { path = "../../infrastructure/artifacts" }
agenticos-workspace = { path = "../../infrastructure/workspace" }
agenticos-terminal = { path = "../../infrastructure/terminal" }
agenticos-agents = { path = "../../application/agents" }
agenticos-brain = { path = "../../domain/brain" }
agenticos-channels = { path = "../../infrastructure/channels" }
agenticos-execution = { path = "../../application/execution" }
agenticos-evaluation = { path = "../../infrastructure/evaluation" }
agenticos-contracts = { path = "../../domain/contracts" }
agenticos-context = { path = "../../infrastructure/context" }
agenticos-kernel = { path = "../../infrastructure/kernel" }
agenticos-memory = { path = "../../infrastructure/memory" }
agenticos-mcp = { path = "../../infrastructure/mcp" }
agenticos-observability = { path = "../../infrastructure/observability" }
agenticos-providers = { path = "../../infrastructure/providers" }
agenticos-projects = { path = "../../infrastructure/projects" }
agenticos-sandbox = { path = "../../infrastructure/sandbox" }
agenticos-tools = { path = "../../infrastructure/tools" }
agenticos-scheduler = { path = "../../application/scheduler" }
agenticos-security = { path = "../../infrastructure/security" }
agenticos-workflows = { path = "../../application/workflows" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
