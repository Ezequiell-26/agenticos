name: AgentiCOS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agenticos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify architecture, types and tests
        run: npm run verify

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Check dependency tree
        run: npm ls --depth=0
