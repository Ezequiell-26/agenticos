[package]
name = "agenticos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agenticos"
path = "src/main.rs"

[dependencies]
agenticos-contracts = { path = "../contracts" }
agenticos-kernel = { path = "../kernel" }
agenticos-execution = { path = "../execution" }
agenticos-providers = { path = "../providers" }
agenticos-tools = { path = "../tools" }
agenticos-memory = { path = "../memory" }
agenticos-protocols = { path = "../protocols" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"

[lints]
workspace = true
