name: Format Rust sources

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rust-format-main
  cancel-in-progress: true

jobs:
  format:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust sources already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' '*.toml'
          git commit -m "style(rust): normalize formatting"
          git push
