name: AgentiCOS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agenticos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify durable AI continuity
        run: npm run continuity:verify

      - name: Verify project-state consistency
        run: npm run state:verify

      - name: Verify architecture, types and tests
        run: npm run verify

      - name: Verify frontend architecture contract
        run: npm run frontend:architecture

      - name: Verify frontend runtime contract
        run: npm run frontend:runtime-contract

      - name: Install desktop frontend dependencies
        run: npm ci --no-audit --no-fund --prefix crates/presentation/desktop/frontend

      - name: Build desktop frontend
        run: npm run build --prefix crates/presentation/desktop/frontend

      - name: Verify provider integration coverage
        run: npm run provider:coverage

      - name: Validate implementation state manifest
        run: node scripts/verify-project-consistency.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Check dependency tree
        run: npm ls --depth=0

  verify-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check -p agenticos-brain -p agenticos-providers --all-targets

      - name: Test workspace
        run: cargo test -p agenticos-brain --lib

      - name: Provider integration tests
        run: cargo test -p agenticos-providers --test provider_plane_integration -- --nocapture

      - name: Clippy
        run: cargo clippy -p agenticos-brain -p agenticos-providers --all-targets -- -D warnings

      - name: Provider integration tests
        run: cargo test -p agenticos-providers --test provider_plane_integration -- --nocapture

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
