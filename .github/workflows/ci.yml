name: AgentiCOS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agenticos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify durable AI continuity
        run: npm run continuity:verify

      - name: Verify architecture, types and tests
        run: npm run verify

      - name: Validate implementation state manifest
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const state = JSON.parse(
            fs.readFileSync("reference/manifests/implementation-state.json", "utf8"),
          );
          if (
            state.policy.one_step_at_a_time !== true ||
            state.policy.next_step_requires_verified_previous !== true ||
            state.policy.fail_closed !== true
          ) process.exit(1);
          if (!Array.isArray(state.steps) || state.steps.length < 2) process.exit(1);
          const active = state.steps.filter((step) => step.status === "in_progress");
          if (active.length > 1) process.exit(1);
          console.log("implementation state manifest: PASS");
          NODE

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Check dependency tree
        run: npm ls --depth=0

  verify-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify architecture workspace shape
        run: |
          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f protocols/schemas/event-envelope.schema.json
          test -f reference/manifests/implementation-state.json
          test -f reference/manifests/mit-repositories.json
          echo "Rust architecture foundation: PASS"
