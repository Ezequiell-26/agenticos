name: one-shot-rustfmt

on:
  push:
    branches: ["architecture/canonical-brain-foundation"]

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/architecture/canonical-brain-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace and remove this helper
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/one-shot-rustfmt.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: rustfmt workspace and remove one-shot formatter"
          git push
