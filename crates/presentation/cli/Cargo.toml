[package]
name = "agenticos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agenticos"
path = "src/main.rs"

[dependencies]
agenticos-contracts = { path = "../../domain/contracts" }
agenticos-kernel = { path = "../../infrastructure/kernel" }
agenticos-execution = { path = "../../application/execution" }
agenticos-providers = { path = "../../infrastructure/providers" }
agenticos-tools = { path = "../../infrastructure/tools" }
agenticos-memory = { path = "../../infrastructure/memory" }
agenticos-protocols = { path = "../../infrastructure/protocols" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"

[lints]
workspace = true
