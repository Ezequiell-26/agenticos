name: one-shot-rustfmt-final-v2

on:
  push:
    branches: ["architecture/canonical-layout-final-v2"]

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/architecture/canonical-layout-final-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace and remove helper
        run: |
          git fetch origin architecture/canonical-layout-final-v2
          git reset --hard origin/architecture/canonical-layout-final-v2
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-rustfmt-final-v2.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: rustfmt canonical workspace"
          git push origin HEAD:architecture/canonical-layout-final-v2
