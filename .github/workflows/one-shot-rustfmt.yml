name: One-shot Rustfmt Repair

on:
  push:
    branches:
      - architecture/ai-operating-contract-and-frontend-foundation-2026-09-23

permissions:
  contents: write

jobs:
  rustfmt:
    if: !contains(github.event.head_commit.message, 'chore: apply rustfmt')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "RUSTFMT: already clean"
            exit 0
          fi
          git config user.name "AgentiCOS Bot"
          git config user.email "agenticos-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply rustfmt"
          git push origin HEAD:${{ github.ref_name }}
