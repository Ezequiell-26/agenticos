name: one-shot-rustfmt-final

on:
  push:
    branches: ["architecture/canonical-layout-final"]

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/architecture/canonical-layout-final'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace and remove helper
        run: |
          git fetch origin architecture/canonical-layout-final
          git reset --hard origin/architecture/canonical-layout-final
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-rustfmt-final.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: rustfmt workspace and remove temporary formatter"
          git push origin HEAD:architecture/canonical-layout-final
