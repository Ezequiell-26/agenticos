name: AgentiCOS Frontend Verification

on:
  push:
    branches: ["main"]
    paths:
      - "crates/presentation/desktop/frontend/**"
      - ".github/workflows/frontend-verification.yml"
  pull_request:
    paths:
      - "crates/presentation/desktop/frontend/**"
      - ".github/workflows/frontend-verification.yml"

permissions:
  contents: read

concurrency:
  group: agenticos-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --prefix crates/presentation/desktop/frontend
      - name: TypeScript and Vite production build
        run: npm run build --prefix crates/presentation/desktop/frontend
