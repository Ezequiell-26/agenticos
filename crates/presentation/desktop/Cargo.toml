[package]
name = "agenticos-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
agenticos-kernel = { path = "../../infrastructure/kernel" }
agenticos-contracts = { path = "../../domain/contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
